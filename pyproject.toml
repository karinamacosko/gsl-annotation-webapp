[tool.poetry]
name = "gsl-annotator"
version = "0.1.0"
description = "English to Ghanaian Sign Language annotation tool"
authors = ["GSL Annotation Team"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.110"
uvicorn = {extras = ["standard"], version = ">=0.29"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
