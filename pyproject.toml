[project]
name = "gsl-annotator"
version = "0.1.0"
description = "English to Ghanaian Sign Language annotation tool"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
